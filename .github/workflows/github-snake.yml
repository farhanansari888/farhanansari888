name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Generates a snake game from a github user contributions graph, outputting SVGs
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: farhanansari888
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff4081&color_dots=#160c28,#3a1c5d,#7c4dff,#e91e63,#ff4081
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00f2fe&color_dots=#0b0813,#1a103c,#5e35b1,#d81b60,#ff4081

      # Push the generated SVGs to the output branch
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
